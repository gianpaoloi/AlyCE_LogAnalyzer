name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, so the main-branch check below can resolve the tagged commit.
          fetch-depth: 0

      # ---------------------------------------------------------------
      # 2. Refuse to release a tag that is not on main
      # ---------------------------------------------------------------
      # A tag trigger fires wherever the tag was placed, so without this a version tag pushed from
      # a feature branch would publish a release built from unmerged code.
      - name: Verify the tag is on main
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $sha = $env:GITHUB_SHA

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch origin/main to check the tag against." }

          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) {
            $msg = "Tag $tag points at $sha, which is not an ancestor of main. " +
                   "Merge the work into main first, then tag the merge commit."
            throw $msg
          }

          Write-Host "Tagged commit $sha is on main."

      # ---------------------------------------------------------------
      # 3. Parse version from tag (strips leading 'v')
      # ---------------------------------------------------------------
      # Three values come out of the one tag, because the MAUI SDK validates its two version
      # properties strictly and neither of them accepts a full SemVer string:
      #
      #   ApplicationDisplayVersion  must be exactly major.minor.patch -> CORE
      #   ApplicationVersion         must be a plain integer build number -> BUILD
      #   InformationalVersion       is free-form, so it keeps the tag verbatim -> VERSION
      #
      # VERSION is also what names the files and titles the release.
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"          # e.g. v1.2.3 or v1.3.0-rc1
          $ver = $tag.TrimStart('v')               # e.g. 1.2.3  or 1.3.0-rc1

          $m = [regex]::Match($ver, '^(\d+)\.(\d+)\.(\d+)(-.+)?$')
          if (-not $m.Success) {
            throw "Tag '$tag' is not vMAJOR.MINOR.PATCH[-suffix], so no MAUI version can be derived from it."
          }

          $major = [int]$m.Groups[1].Value
          $minor = [int]$m.Groups[2].Value
          $patch = [int]$m.Groups[3].Value
          $core  = "$major.$minor.$patch"          # drops any -rc1 suffix

          # One increasing integer per release. minor/patch get two digits each, so anything
          # above 99 would collide with the next field up — fail loudly rather than ship a
          # build number that silently means a different version.
          if ($minor -gt 99 -or $patch -gt 99) {
            throw "Version $core does not fit the major*10000 + minor*100 + patch build-number scheme."
          }
          $build = $major * 10000 + $minor * 100 + $patch

          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "CORE=$core"   >> $env:GITHUB_OUTPUT
          echo "BUILD=$build" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag"     >> $env:GITHUB_OUTPUT
          Write-Host "Tag $tag -> version $ver (display $core, build number $build)"

      # ---------------------------------------------------------------
      # 4. Setup .NET 10
      # ---------------------------------------------------------------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ---------------------------------------------------------------
      # 5. Install .NET MAUI workload
      # ---------------------------------------------------------------
      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      # ---------------------------------------------------------------
      # 6. Run the unit tests — a release should not ship if they fail
      # ---------------------------------------------------------------
      - name: Run tests
        run: dotnet test LogAnalyzer.Tests/LogAnalyzer.Tests.csproj -c Release --nologo

      # ---------------------------------------------------------------
      # 7. Publish MAUI app (self-contained, win-x64, Release)
      # ---------------------------------------------------------------
      # Published once and consumed by both the installer and the portable ZIP below, so the two
      # downloads cannot end up containing different binaries.
      - name: Publish MAUI app
        shell: pwsh
        run: |
          dotnet publish LogAnalyzer.Maui/LogAnalyzer.Maui.csproj `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            --runtime win-x64 `
            --self-contained `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:ApplicationDisplayVersion="${{ steps.version.outputs.CORE }}" `
            -p:ApplicationVersion="${{ steps.version.outputs.BUILD }}" `
            -p:InformationalVersion="${{ steps.version.outputs.VERSION }}"

      # ---------------------------------------------------------------
      # 8. Package the portable (redistributable) ZIP
      # ---------------------------------------------------------------
      # Same publish output as the installer, wrapped with a relative-path launcher and a README.
      - name: Create portable ZIP
        id: zip
        shell: pwsh
        run: |
          ./LogAnalyzer.Maui/create-portable-zip.ps1 `
            -PublishDir "LogAnalyzer.Maui/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish" `
            -Version "${{ steps.version.outputs.VERSION }}" `
            -OutputDir "LogAnalyzer.Maui/dist" `
            -HowToPath "README-HOW-TO.txt"

      # ---------------------------------------------------------------
      # 9. Install Inno Setup
      # ---------------------------------------------------------------
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # ---------------------------------------------------------------
      # 10. Compile installer
      # ---------------------------------------------------------------
      - name: Compile installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=$ver LogAnalyzer.Maui/installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      # ---------------------------------------------------------------
      # 11. Hash both artifacts (the installer hash goes into the winget manifest)
      # ---------------------------------------------------------------
      - name: Compute SHA256
        id: sha256
        shell: pwsh
        run: |
          $ver       = "${{ steps.version.outputs.VERSION }}"
          $installer = "LogAnalyzer.Maui/dist/AlyCE-LogAnalyzer-Setup-$ver.exe"
          $zip       = "${{ steps.zip.outputs.ZIP }}"

          foreach ($f in @($installer, $zip)) {
            if (-not (Test-Path -LiteralPath $f)) { throw "Expected artifact is missing: $f" }
          }

          $hash    = (Get-FileHash $installer -Algorithm SHA256).Hash.ToUpper()
          $zipHash = (Get-FileHash $zip       -Algorithm SHA256).Hash.ToUpper()
          Write-Host "Installer SHA256: $hash"
          Write-Host "ZIP SHA256:       $zipHash"

          echo "HASH=$hash"           >> $env:GITHUB_OUTPUT
          echo "ZIP_HASH=$zipHash"    >> $env:GITHUB_OUTPUT
          echo "INSTALLER=$installer" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------------
      # 12. Keep the built artifacts even if the release step fails
      # ---------------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alyce-loganalyzer-${{ steps.version.outputs.VERSION }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            LogAnalyzer.Maui/dist/*.exe
            LogAnalyzer.Maui/dist/*.zip

      # ---------------------------------------------------------------
      # 13. Assemble the release notes from CHANGELOG.md
      # ---------------------------------------------------------------
      # Written to a file and passed to the release step as body_path rather than inlined there: the
      # changelog is arbitrary Markdown full of backticks, pipes and quotes, none of which survives
      # being squeezed through a step output or a YAML scalar unescaped.
      #
      # A missing section is a warning, never a failure. By this point the app is built, tested and
      # packaged; throwing that away over a documentation slip would mean deleting the tag and
      # starting the whole run again.
      - name: Build release notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $core    = "${{ steps.version.outputs.CORE }}"
          $tag     = "${{ steps.version.outputs.TAG }}"
          $zipName = "${{ steps.zip.outputs.ZIP_NAME }}"
          $changelogUrl = "https://github.com/${{ github.repository }}/blob/$tag/CHANGELOG.md"

          # A release body is capped at 125,000 characters. Staying well under it leaves room for
          # everything appended after the changelog, however long that section turns out to be.
          $maxChars = 40000

          # Keep a Changelog puts each release under a "## [version]" heading, so a section runs from
          # that heading to the next "## " one. The "### Added" subheadings inside are not matched:
          # '^##\s' requires whitespace where their third '#' sits.
          function Get-ChangelogSection([string[]] $lines, [string] $wanted) {
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -notmatch '^##\s') { continue }
              if ($start -ge 0) {
                # Reached the next release heading. An empty section would produce a descending
                # range, which PowerShell silently reverses, so it is returned explicitly.
                if ($i - 1 -lt $start) { return @() }
                return $lines[$start..($i - 1)]
              }
              # Accepts "## [1.2.3]", "## 1.2.3", and either dash in "## [1.2.3] - 2026-01-01".
              if ($lines[$i] -match '^##\s+\[?([^\]\s]+)\]?' -and $Matches[1] -eq $wanted) {
                $start = $i + 1
              }
            }
            if ($start -ge 0) { return $lines[$start..($lines.Count - 1)] }
            return $null
          }

          # Rooted at the workspace rather than relative, so the step does not depend on a working
          # directory it never sets.
          $changelogPath = Join-Path $env:GITHUB_WORKSPACE 'CHANGELOG.md'
          $lines = @(Get-Content -LiteralPath $changelogPath -Encoding utf8)
          $changes = @()
          $usedSection = $null

          # A prerelease tag may have a section of its own; otherwise fall back to the release it is
          # a candidate for, and then to whatever is still sitting under Unreleased.
          foreach ($candidate in @($version, $core, 'Unreleased')) {
            $section = Get-ChangelogSection $lines $candidate
            if ($null -eq $section) { continue }

            # This marker tags an entry as unreleased while it sits in a working tree. On a release
            # page it is both noise and untrue.
            $section = $section -replace '\s*\*\(working tree, not yet committed\)\*', ''

            # Drop the blank lines left behind by the headings at either end.
            #
            # Walked with indices rather than by re-slicing the array: PowerShell turns $a[1..0] into
            # the range @(1,0), silently skips the out-of-range index, and hands back the same single
            # element — so the obvious "chop the first line off until it isn't blank" loop never ends
            # for a section that is nothing but blank lines.
            $first = 0
            $last = $section.Count - 1
            while ($first -le $last -and [string]::IsNullOrWhiteSpace($section[$first])) { $first++ }
            while ($last -ge $first -and [string]::IsNullOrWhiteSpace($section[$last])) { $last-- }

            # A heading with nothing under it: keep looking, there may be a better candidate.
            if ($first -gt $last) { continue }

            $changes = @($section[$first..$last])
            $usedSection = $candidate
            break
          }

          if (-not $usedSection) {
            Write-Host "::warning::CHANGELOG.md has no usable section for $version, $core or Unreleased, so the notes link to it instead of quoting it."
          } elseif ($usedSection -eq 'Unreleased') {
            Write-Host "::warning::CHANGELOG.md has no '## [$core]' section, so the notes were taken from Unreleased. Move that section under a version heading to keep the changelog and the releases in step."
          } else {
            Write-Host "Release notes taken from the CHANGELOG.md section for $usedSection ($($changes.Count) lines)."
          }

          # Truncate on a line boundary, so a table or a fenced code block is never cut in half.
          $kept = [System.Collections.Generic.List[string]]::new()
          $used = 0
          $truncated = $false
          foreach ($line in $changes) {
            if ($used + $line.Length + 1 -gt $maxChars) { $truncated = $true; break }
            $kept.Add($line)
            $used += $line.Length + 1
          }
          if ($truncated) {
            Write-Host "::warning::The changelog section is longer than $maxChars characters and was truncated in the release notes."
          }

          $notes = [System.Collections.Generic.List[string]]::new()
          $notes.Add("## AlyCE Log Analyzer $version")
          $notes.Add("")

          if ($kept.Count -gt 0) {
            # The section brings its own "### Added" / "### Fixed" headings, which is why nothing is
            # added above it here.
            $notes.AddRange($kept)
            if ($truncated) {
              $notes.Add("")
              $notes.Add("_Truncated - see [CHANGELOG.md]($changelogUrl) for the rest._")
            }
            $notes.Add("")
          }

          $notes.Add("### Install via winget (WIP, prefer the downloads)")
          $notes.Add('```')
          $notes.Add("winget install TeamSystem.AlyCELogAnalyzer")
          $notes.Add('```')
          $notes.Add("")
          $notes.Add("### Downloads")
          $notes.Add("")
          $notes.Add("| File | Use it when |")
          $notes.Add("|------|-------------|")
          $notes.Add("| ``AlyCE-LogAnalyzer-Setup-$version.exe`` | **Recommended.** Installs per-user (no admin rights), adds Start-menu entries, and installs the WebView2 runtime if it is missing. |")
          $notes.Add("| ``$zipName`` | Portable - extract anywhere and run ``Launch.bat``. Nothing is installed and nothing is written to the registry. Needs the WebView2 runtime to be present already. |")
          $notes.Add("")
          $notes.Add("Both contain the same self-contained build; no .NET runtime is required.")
          $notes.Add("")
          $notes.Add("### SHA256")
          $notes.Add('```')
          $notes.Add("${{ steps.sha256.outputs.HASH }}  AlyCE-LogAnalyzer-Setup-$version.exe")
          $notes.Add("${{ steps.sha256.outputs.ZIP_HASH }}  $zipName")
          $notes.Add('```')
          $notes.Add("Use the installer hash when updating the winget manifest (see ``winget/manifests/``).")
          $notes.Add("")
          $notes.Add("### System requirements")
          $notes.Add("- Windows 10 version 17763 (1809) or later")
          $notes.Add("- x64 processor")
          $notes.Add("- No .NET runtime required (self-contained)")
          $notes.Add("- Microsoft Edge WebView2 Runtime - the installer adds it automatically when missing (bundled with Windows 11; no admin rights required). The portable ZIP does not.")
          $notes.Add("")
          $notes.Add("---")
          $notes.Add("")
          $notes.Add("Full history: [CHANGELOG.md]($changelogUrl)")

          # UTF-8 with no BOM: the API would render a BOM as a stray character at the top of the page.
          $path = Join-Path $env:GITHUB_WORKSPACE 'release-notes.md'
          [System.IO.File]::WriteAllText($path, ($notes -join "`n"), [System.Text.UTF8Encoding]::new($false))

          Write-Host "----- release-notes.md ($((Get-Item $path).Length) bytes) -----"
          Get-Content -LiteralPath $path | Select-Object -First 30

      # ---------------------------------------------------------------
      # 14. Create GitHub Release
      # ---------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "AlyCE Log Analyzer ${{ steps.version.outputs.VERSION }}"
          # Built by the previous step from CHANGELOG.md, so the notes say what actually changed
          # rather than repeating the same boilerplate on every release.
          body_path: release-notes.md
          # Forward-slash relative paths: this input is glob-expanded, and a Windows absolute path's
          # backslashes would be read as escape characters.
          files: |
            LogAnalyzer.Maui/dist/AlyCE-LogAnalyzer-Setup-${{ steps.version.outputs.VERSION }}.exe
            LogAnalyzer.Maui/dist/${{ steps.zip.outputs.ZIP_NAME }}
          fail_on_unmatched_files: true
          draft: false
          # 'v*.*.*' also matches a tag like v1.3.0-rc1 (the trailing * absorbs "0-rc1"), so mark
          # anything carrying a SemVer prerelease suffix as a prerelease rather than shipping it as
          # a full release.
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
