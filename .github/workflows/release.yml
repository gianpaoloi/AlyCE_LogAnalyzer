name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. Parse version from tag (strips leading 'v')
      # ---------------------------------------------------------------
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"          # e.g. v1.2.3
          $ver = $tag.TrimStart('v')               # e.g. 1.2.3
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag"     >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $ver"

      # ---------------------------------------------------------------
      # 3. Setup .NET 10
      # ---------------------------------------------------------------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ---------------------------------------------------------------
      # 4. Install .NET MAUI workload
      # ---------------------------------------------------------------
      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      # ---------------------------------------------------------------
      # 5. Publish MAUI app (self-contained, win-x64, Release)
      # ---------------------------------------------------------------
      - name: Publish MAUI app
        shell: pwsh
        run: |
          dotnet publish LogAnalyzer.Maui/LogAnalyzer.Maui.csproj `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            --runtime win-x64 `
            --self-contained `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:ApplicationDisplayVersion="${{ steps.version.outputs.VERSION }}" `
            -p:ApplicationVersion="${{ steps.version.outputs.VERSION }}"

      # ---------------------------------------------------------------
      # 6. Install Inno Setup
      # ---------------------------------------------------------------
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # ---------------------------------------------------------------
      # 7. Compile installer
      # ---------------------------------------------------------------
      - name: Compile installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=$ver LogAnalyzer.Maui/installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      # ---------------------------------------------------------------
      # 8. Compute SHA256 of the installer
      # ---------------------------------------------------------------
      - name: Compute SHA256
        id: sha256
        shell: pwsh
        run: |
          $ver       = "${{ steps.version.outputs.VERSION }}"
          $installer = "LogAnalyzer.Maui/dist/AlyCE-LogAnalyzer-Setup-$ver.exe"
          $hash      = (Get-FileHash $installer -Algorithm SHA256).Hash.ToUpper()
          Write-Host "SHA256: $hash"
          echo "HASH=$hash"          >> $env:GITHUB_OUTPUT
          echo "INSTALLER=$installer" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------------
      # 9. Create GitHub Release
      # ---------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "AlyCE Log Analyzer ${{ steps.version.outputs.VERSION }}"
          body: |
            ## AlyCE Log Analyzer ${{ steps.version.outputs.VERSION }}

            ### Install via winget
            ```
            winget install TeamSystem.AlyCELogAnalyzer
            ```

            ### Manual download
            Download `AlyCE-LogAnalyzer-Setup-${{ steps.version.outputs.VERSION }}.exe` below and run it.

            ### Installer SHA256
            ```
            ${{ steps.sha256.outputs.HASH }}
            ```
            Use this hash when updating the winget manifest (see `winget/manifests/`).

            ### System requirements
            - Windows 10 version 17763 (1809) or later
            - x64 processor
            - No .NET runtime required (self-contained)
          files: LogAnalyzer.Maui/dist/AlyCE-LogAnalyzer-Setup-${{ steps.version.outputs.VERSION }}.exe
          draft: false
          prerelease: false
