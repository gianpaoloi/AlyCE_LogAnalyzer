# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.9.0.schema.json
# Winget installer manifest for TeamSystem.AlyCELogAnalyzer
#
# Before submitting to microsoft/winget-pkgs, replace:
#   {{INSTALLER_URL}} with the direct download URL of the .exe from the GitHub Release
#   {{SHA256}}        with the SHA256 hash printed in the GitHub Release notes
#
# Example URL:
#   https://github.com/<your-org>/AlyCE_LogAnalyzer/releases/download/v1.0.0/AlyCE-LogAnalyzer-Setup-1.0.0.exe
#
PackageIdentifier: TeamSystem.AlyCELogAnalyzer
PackageVersion: 1.0.0
MinimumOSVersion: 10.0.17763.0
Installers:
  - Architecture: x64
    InstallerType: inno
    InstallerUrl: "{{INSTALLER_URL}}"
    InstallerSha256: "{{SHA256}}"
    Scope: user
    InstallModes:
      - interactive
      - silent
    InstallerSwitches:
      Silent: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
      SilentWithProgress: /SILENT /SUPPRESSMSGBOXES /NORESTART /SP-
    UpgradeBehavior: install
ManifestType: installer
ManifestVersion: 1.9.0
